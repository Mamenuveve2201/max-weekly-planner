<style>:root{--bg:#0f0e17;--sf:#1a1929;--sf2:#22203a;--bd:#2e2b4a;--bd2:#3d3a5e;--tx:#fffffe;--mu:#a7a9be;--ac:#ff8906;--ac2:#ffb347;--tl:#3da9fc;--gr:#00c897;--co:#ef4565;--serif:"DM Serif Display",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;--hh:48px;--tc:46px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;min-height:100vh;overflow-x:hidden;}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:50;}
.hdr-title{font-family:var(--serif);font-size:20px;color:var(--ac2);}
.hdr-title small{color:var(--mu);font-family:var(--sans);font-size:11px;font-weight:300;margin-left:6px;}
.hdr-r{display:flex;gap:8px;align-items:center;}
.sd{width:7px;height:7px;border-radius:50%;background:var(--mu);}.sd.ok{background:var(--gr);}.sd.err{background:var(--co);}
.sl{font-size:11px;color:var(--mu);}
.btn{background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);border-radius:6px;padding:5px 11px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--sans);transition:all .15s;white-space:nowrap;}
.btn:hover{border-color:var(--ac);color:var(--ac2);}.btn.ac{background:var(--ac);color:#0f0e17;border-color:var(--ac);font-weight:700;}.btn.ac:hover{background:var(--ac2);}
.wnav{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--bd);}.wlbl{font-size:13px;font-weight:500;flex:1;}
.leg{display:flex;gap:10px;flex-wrap:wrap;padding:5px 16px;border-bottom:1px solid var(--bd);}.li{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--mu);}.ld{width:9px;height:9px;border-radius:2px;}
.dhrow{display:grid;border-bottom:1px solid var(--bd);padding:0 16px 0 calc(16px + var(--tc));}.dh{text-align:center;padding:5px 2px;}.dhn{font-size:9px;font-weight:700;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;}.dhd{font-size:17px;font-weight:500;color:var(--tx);margin-top:2px;line-height:1;}
.dh.today .dhd{background:var(--ac);color:#0f0e17;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:2px auto 0;font-size:14px;}
.cscroll{overflow-y:auto;max-height:calc(100vh - 212px);}.cgrid{display:grid;padding:0 16px;position:relative;}
.tlbl{font-size:10px;color:var(--mu);padding-right:5px;text-align:right;transform:translateY(-7px);width:var(--tc);pointer-events:none;}
.hcell{height:var(--hh);border-left:1px solid var(--bd);border-top:1px solid var(--bd);position:relative;cursor:pointer;}
.hcell:hover{background:rgba(255,137,6,.04);}.hcell:last-of-type{border-right:1px solid var(--bd);}
.hcell::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed rgba(46,43,74,.7);pointer-events:none;}
.bbcell{height:1px;border-top:1px solid var(--bd);border-left:1px solid var(--bd);}.bbcell:last-child{border-right:1px solid var(--bd);}
.ev{position:absolute;left:2px;right:2px;border-radius:5px;padding:2px 4px;font-size:10px;overflow:hidden;z-index:2;border-left:3px solid transparent;line-height:1.3;}
.evt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.evs{opacity:.75;font-size:9px;margin-top:1px;}
.cls{background:rgba(61,169,252,.15);border-color:var(--tl);color:var(--tl);cursor:default;}.tsk{cursor:pointer;}
.tsk.ph{background:rgba(239,69,101,.18);border-color:var(--co);color:#ff8fa3;}.tsk.pm{background:rgba(255,137,6,.15);border-color:var(--ac);color:var(--ac2);}.tsk.pl{background:rgba(0,200,151,.12);border-color:var(--gr);color:var(--gr);}
.nowln{position:absolute;left:0;right:0;height:2px;background:var(--co);z-index:3;pointer-events:none;}.nowln::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--co);}
.ubot{padding:0 16px 40px;}.urow{display:grid;border-top:1px solid var(--bd);}.udp{border-left:1px solid var(--bd);padding:6px 5px;min-height:50px;}.udp:last-child{border-right:1px solid var(--bd);}
.udph{font-size:9px;color:var(--mu);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;}
.pill{display:flex;align-items:center;gap:4px;background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:3px 7px;margin-bottom:3px;font-size:10px;cursor:pointer;overflow:hidden;transition:border-color .15s;}
.pill:hover{border-color:var(--bd2);}.pill.done .ptxt{text-decoration:line-through;color:var(--mu);}
.pck{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--bd2);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.pck.done{background:var(--gr);border-color:var(--gr);}.pck.done::after{content:"\u2713";font-size:7px;color:#0f0e17;font-weight:700;}
.ptxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}.pdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.ph .pdot{background:var(--co);}.pm .pdot{background:var(--ac);}.pl .pdot{background:var(--gr);}
.padd{color:var(--mu);border-style:dashed;justify-content:center;}.padd:hover{color:var(--ac);border-color:var(--ac);}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;}.mbg.open{opacity:1;pointer-events:all;}
.modal{background:var(--sf);border:1px solid var(--bd2);border-radius:10px 10px 0 0;padding:18px;width:100%;max-width:480px;transform:translateY(20px);transition:transform .2s;max-height:88vh;overflow-y:auto;}.mbg.open .modal{transform:translateY(0);}
.mttl{font-family:var(--serif);font-size:17px;color:var(--ac2);margin-bottom:14px;}.fld{margin-bottom:11px;}
.fld label{display:block;font-size:10px;color:var(--mu);margin-bottom:3px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.fld input,.fld select{width:100%;background:var(--bg);border:1px solid var(--bd2);border-radius:6px;color:var(--tx);font-family:var(--sans);font-size:13px;padding:7px 10px;outline:none;transition:border-color .15s;appearance:none;}
.fld input:focus,.fld select:focus{border-color:var(--ac);}.fld select option{background:var(--sf);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.macts{display:flex;gap:8px;margin-top:14px;}
.bpri{flex:1;background:var(--ac);color:#0f0e17;border:none;border-radius:6px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);}.bpri:hover{background:var(--ac2);}
.bcan{background:none;border:1px solid var(--bd2);color:var(--mu);border-radius:6px;padding:9px 14px;font-size:13px;cursor:pointer;font-family:var(--sans);}.bcan:hover{border-color:var(--tx);color:var(--tx);}
.bdel{background:var(--co);color:#fff;border:none;border-radius:6px;padding:9px 14px;font-size:13px;cursor:pointer;font-family:var(--sans);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);border-radius:6px;padding:8px 16px;font-size:12px;opacity:0;transition:all .25s;pointer-events:none;z-index:200;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}</style>

<script>var SB="https://uvqjswdfcixwktgvnzbq.supabase.co";
var AK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2cWpzd2RmY2l4d2t0Z3ZuemJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDE3MzIxOTgsImV4cCI6MjA1NzMwODE5OH0.gHcCDGVMfjUJaUgLBCCNJwOm0ukzD0LbdHFfcYEsqoI";

var tasks=[],weekOff=0,editId=null;
function hh(){return parseInt(getComputedStyle(document.documentElement).getPropertyValue("--hh"))||48;}
function tMin(t){var p=t.split(":");return parseInt(p[0])*60+parseInt(p[1]);}
function mTime(m){return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+(m%60)).slice(-2);}
function tPx(t){return(tMin(t)-SH*60)/60*hh();}
function hPx(s,e){return(tMin(e)-tMin(s))/60*hh();}
function getMon(){var d=new Date(),w=d.getDay();d.setDate(d.getDate()+(w===0?-6:1-w)+weekOff*7);d.setHours(0,0,0,0);return d;}
function getWeek(){var m=getMon();return[0,1,2,3,4,5,6].map(function(i){var d=new Date(m);d.setDate(d.getDate()+i);return d;});}
function fd(d){return d.toISOString().slice(0,10);}
function today(){return fd(new Date());}
function isToday(d){return fd(d)===today();}
function setSS(s){document.getElementById("sd").className="sd"+(s==="ok"?" ok":s==="err"?" err":"");document.getElementById("sl").textContent=s==="ok"?"Synced":s==="err"?"Offline":"Syncing...";}
function dbLoad(){setSS("syncing");fetch(SB+"/rest/v1/user_data?user_id=eq."+UID+"&select="+COL,{headers:{apikey:AK,Authorization:"Bearer "+AK}}).then(function(r){return r.json();}).then(function(rows){if(rows&&rows[0]&&rows[0][COL])tasks=rows[0][COL].tasks||[];setSS("ok");render();}).catch(function(){setSS("err");render();});}
function dbSave(){var b={};b[COL]={tasks:tasks};fetch(SB+"/rest/v1/user_data?user_id=eq."+UID,{method:"PATCH",headers:{apikey:AK,Authorization:"Bearer "+AK,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(b)}).then(function(r){setSS(r.ok?"ok":"err");}).catch(function(){setSS("err");});}
function syncAll(){dbLoad();}
function prevW(){weekOff--;render();}function nextW(){weekOff++;render();}function goToday(){weekOff=0;render();}
function render(){var dates=getWeek();renderLabel(dates);renderDayHeaders(dates);renderGrid(dates);renderUntimed(dates);requestAnimationFrame(renderNow);}
function renderLabel(dates){var f=function(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});};document.getElementById("wlbl").textContent=f(dates[0])+" - "+f(dates[6])+", "+dates[6].getFullYear();}
function renderDayHeaders(dates){var el=document.getElementById("dhrow");el.style.gridTemplateColumns="var(--tc) repeat(7,1fr)";var h="<div></div>";dates.forEach(function(d,i){var cls="dh"+(isToday(d)?" today":"");h+="<div class="+cls+"><div class=dhn>"+DN[i]+"</div><div class=dhd>"+d.getDate()+"</div></div>";});el.innerHTML=h;}
function renderGrid(dates){var grid=document.getElementById("cgrid");grid.style.gridTemplateColumns="var(--tc) repeat(7,1fr)";grid.style.position="relative";var h="";for(var hr=SH;hr<EH;hr++){var lbl=hr===0?"12am":hr<12?hr+"am":hr===12?"12pm":(hr-12)+"pm";h+="<div class=tlbl>"+lbl+"</div>";for(var d=0;d<7;d++){h+="<div class=hcell data-d="+d+" data-h="+hr+" onclick=qAdd("+d+"," +JSON.stringify(("0"+hr).slice(-2)+":00")+")></div>";}}h+="<div class=tlbl></div>";for(var bd=0;bd<7;bd++)h+="<div class=bbcell></div>";grid.innerHTML=h;dates.forEach(function(date,di){var ds=fd(date);var cell0=grid.querySelector(".hcell[data-d="+JSON.stringify(String(di))+"]");if(!cell0)return;var gr=grid.getBoundingClientRect(),cr=cell0.getBoundingClientRect();var lx=cr.left-gr.left,cw=cr.width;CLS.filter(function(c){return c.day===di;}).forEach(function(c){var b=document.createElement("div");b.className="ev cls";b.style.cssText="top:"+tPx(c.s)+"px;height:"+Math.max(hPx(c.s,c.e),18)+"px;left:"+(lx+2)+"px;width:"+(cw-4)+"px;";var t1=document.createElement("div");t1.className="evt";t1.textContent=c.ti;var t2=document.createElement("div");t2.className="evs";t2.textContent=c.s+"-"+c.e+(c.su?" · "+c.su:"");b.appendChild(t1);b.appendChild(t2);grid.appendChild(b);});tasks.filter(function(t){return!t.done&&t.startTime&&(t.date===ds||(t.repeat&&t.day===di));}).forEach(function(t){var et=t.endTime||mTime(tMin(t.startTime)+60);var b=document.createElement("div");b.className="ev tsk p"+(t.priority||"med");b.style.cssText="top:"+tPx(t.startTime)+"px;height:"+Math.max(hPx(t.startTime,et),18)+"px;left:"+(lx+2)+"px;width:"+(cw-4)+"px;";var t1=document.createElement("div");t1.className="evt";t1.textContent="📌 "+t.title;var t2=document.createElement("div");t2.className="evs";t2.textContent=t.startTime+"-"+et;b.appendChild(t1);b.appendChild(t2);(function(tid){b.onclick=function(ev){ev.stopPropagation();openEdit(tid);};})(t.id);grid.appendChild(b);});});}
function renderUntimed(dates){var g=document.getElementById("urow");g.style.gridTemplateColumns="repeat(7,1fr)";var h="";dates.forEach(function(date,di){var ds=fd(date);var items=tasks.filter(function(t){return!t.startTime&&(t.date===ds||(t.repeat&&t.day===di));});var pills="";items.forEach(function(t){var p=t.priority||"med";pills+="<div class=pill p"+p+(t.done?" done":"")+" onclick=toggleTask("+JSON.stringify(t.id)+")><div class=pck"+(t.done?" done":"")+" ></div><span class=ptxt>"+t.title.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</span><div class=pdot></div><span style=font-size:9px;color:var(--mu);cursor:pointer;flex-shrink:0 onclick=openEdit("+JSON.stringify(t.id)+")>&#9998;</span></div>";});h+="<div class=udp><div class=udph>"+DN[di]+"</div>"+pills+"<div class=pill padd onclick=openAdd("+di+","+JSON.stringify(ds)+")>+ add</div></div>";});g.innerHTML=h;}
function renderNow(){document.querySelectorAll(".nowln").forEach(function(e){e.remove();});if(weekOff!==0)return;var now=new Date();var ts=("0"+now.getHours()).slice(-2)+":"+("0"+now.getMinutes()).slice(-2);if(tMin(ts)<SH*60||tMin(ts)>=EH*60)return;var di=(now.getDay()+6)%7;var cell=document.querySelector(".hcell[data-d="+di+"]");if(!cell)return;var grid=document.getElementById("cgrid");var gr=grid.getBoundingClientRect(),cr=cell.getBoundingClientRect();var ln=document.createElement("div");ln.className="nowln";ln.style.cssText="top:"+tPx(ts)+"px;left:"+(cr.left-gr.left)+"px;right:0;";grid.appendChild(ln);}
function toggleTask(id){var t=tasks.find(function(x){return x.id===id;});if(t){t.done=!t.done;render();dbSave();}}
function delTask(id){tasks=tasks.filter(function(x){return x.id!==id;});closeModal();render();dbSave();toast("Deleted");}
function openAdd(di,ds){editId=null;document.getElementById("mttl").textContent="Add task";buildForm(null,di,ds||"");document.getElementById("macts").innerHTML="";var bc=document.createElement("button");bc.className="bcan";bc.textContent="Cancel";bc.onclick=closeModal;document.getElementById("macts").appendChild(bc);var bp=document.createElement("button");bp.className="bpri";bp.textContent="Save";bp.onclick=saveTask;document.getElementById("macts").appendChild(bp);document.getElementById("mbg").classList.add("open");setTimeout(function(){var el=document.getElementById("ft");if(el)el.focus();},100);}
function openEdit(id){editId=id;var t=tasks.find(function(x){return x.id===id;});if(!t)return;document.getElementById("mttl").textContent="Edit task";buildForm(t,t.day,t.date||"");document.getElementById("macts").innerHTML="";var bd=document.createElement("button");bd.className="bdel";bd.textContent="Delete";(function(i){bd.onclick=function(){delTask(i);};})(id);document.getElementById("macts").appendChild(bd);var bc=document.createElement("button");bc.className="bcan";bc.textContent="Cancel";bc.onclick=closeModal;document.getElementById("macts").appendChild(bc);var bp=document.createElement("button");bp.className="bpri";bp.textContent="Save";bp.onclick=saveTask;document.getElementById("macts").appendChild(bp);document.getElementById("mbg").classList.add("open");}
function qAdd(di,ts){var dates=getWeek();openAdd(di,fd(dates[di]));setTimeout(function(){var el=document.getElementById("fst");if(el)el.value=ts;},80);}
function buildForm(t,di,ds){var mbd=document.getElementById("mbd");mbd.innerHTML="";function mkFld(lbl,el){var w=document.createElement("div");w.className="fld";var l=document.createElement("label");l.textContent=lbl;w.appendChild(l);w.appendChild(el);return w;}function mkInp(id,type,val,ph){var i=document.createElement("input");i.id=id;i.type=type||"text";if(val)i.value=val;if(ph)i.placeholder=ph;return i;}function mkSel(id){var s=document.createElement("select");s.id=id;return s;}function mkOpt(val,txt,sel){var o=document.createElement("option");o.value=val;o.textContent=txt;if(sel)o.selected=true;return o;}var ft=mkInp("ft","text",t?t.title:"","e.g. Study for EST 304 quiz");mbd.appendChild(mkFld("Title",ft));var fr1=document.createElement("div");fr1.className="frow";var fdSel=mkSel("fd");fdSel.appendChild(mkOpt("","-- pick day --",false));DF.forEach(function(d,i){fdSel.appendChild(mkOpt(String(i),d,(t&&t.day===i)||(di===i)));});var fpSel=mkSel("fp");var pr=t&&t.priority?t.priority:"med";[["high","High"],["med","Medium"],["low","Low"]].forEach(function(px){fpSel.appendChild(mkOpt(px[0],px[1],pr===px[0]));});var fdW=document.createElement("div");fdW.className="fld";var fdL=document.createElement("label");fdL.textContent="Day of week";fdW.appendChild(fdL);fdW.appendChild(fdSel);var fpW=document.createElement("div");fpW.className="fld";var fpL=document.createElement("label");fpL.textContent="Priority";fpW.appendChild(fpL);fpW.appendChild(fpSel);fr1.appendChild(fdW);fr1.appendChild(fpW);mbd.appendChild(fr1);mbd.appendChild(mkFld("Specific date (optional)",mkInp("fdt","date",t&&t.date||ds||"")));var fr2=document.createElement("div");fr2.className="frow";var fstW=document.createElement("div");fstW.className="fld";var fstL=document.createElement("label");fstL.textContent="Start time (optional)";fstW.appendChild(fstL);fstW.appendChild(mkInp("fst","time",t&&t.startTime||""));var fetW=document.createElement("div");fetW.className="fld";var fetL=document.createElement("label");fetL.textContent="End time (optional)";fetW.appendChild(fetL);fetW.appendChild(mkInp("fet","time",t&&t.endTime||""));fr2.appendChild(fstW);fr2.appendChild(fetW);mbd.appendChild(fr2);var rw=document.createElement("div");rw.className="fld";rw.style.cssText="display:flex;align-items:center;gap:8px";var cb=document.createElement("input");cb.type="checkbox";cb.id="frp";if(t&&t.repeat)cb.checked=true;cb.style.cssText="width:auto;accent-color:var(--ac)";var cl=document.createElement("label");cl.htmlFor="frp";cl.textContent="Repeat every week on this day";cl.style.cssText="display:inline;font-size:12px;color:var(--mu)";rw.appendChild(cb);rw.appendChild(cl);mbd.appendChild(rw);}
